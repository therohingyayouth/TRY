<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - TRY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 w-full max-w-md">
        <h2 class="text-2xl font-extrabold mb-6 text-center text-[#1b4d3e]">Admin Dashboard</h2>
        
        <!-- Add Program Form -->
        <form id="post-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Program/Activity Title</label>
                <input type="text" id="title" required class="mt-1 block w-full p-2.5 text-sm border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#1b4d3e]">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Description</label>
                <textarea id="description" rows="3" required class="mt-1 block w-full p-2.5 text-sm border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#1b4d3e]"></textarea>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Image URL (Optional)</label>
                <input type="url" id="imageUrl" placeholder="Paste direct image link here" class="mt-1 block w-full p-2.5 text-sm border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#1b4d3e]">
            </div>
            <button type="submit" class="w-full bg-[#1b4d3e] hover:bg-[#14382d] text-white py-3 rounded-xl font-bold text-sm shadow-sm transition">Publish Program</button>
        </form>
        <div class="mt-5 text-center">
            <a href="index.html" class="text-xs font-semibold text-[#1b4d3e] hover:underline">← Back to Website</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBQVYDNmEC6d0lAP9IxQ-_WchFHN7vC6Mw",
          authDomain: "therohingyayouth-65144.firebaseapp.com",
          projectId: "therohingyayouth-65144",
          storageBucket: "therohingyayouth-65144.firebasestorage.app",
          messagingSenderId: "265753874344",
          appId: "1:265753874344:web:f0940ce44fecce3770579d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('post-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const imageUrl = document.getElementById('imageUrl').value;

            try {
                await addDoc(collection(db, "programs"), {
                    title,
                    description,
                    imageUrl,
                    createdAt: new Date()
                });
                alert('Program published successfully!');
                form.reset();
            } catch (error) {
                alert('Error adding document: ' + error.message);
            }
        });
    </script>
</body>
</html>
